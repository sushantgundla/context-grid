[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-grid"
version = "0.9.1"
description = "A lab for grounding pipelines: sweep parser x chunker x embedder x index x reranker on your own documents, scored on quality, latency and cost."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sushant Gundla" }]
keywords = ["rag", "retrieval", "evaluation", "benchmark", "embeddings", "chunking", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # No `License :: OSI Approved :: MIT License` classifier: PEP 639 replaced it with the
    # `license = "MIT"` expression above, and carrying both is how a build ends up declaring
    # the licence twice and disagreeing with itself.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# `Typing :: Typed` above is a promise, and `py.typed` is what keeps it. Without that marker
# file inside the package, PEP 561 tells every type checker to ignore the annotations in an
# installed copy -- so the classifier would be advertising a guarantee that nobody downstream
# could actually collect on.

# The core stays dependency-free on purpose. Everything heavy lives behind an extra,
# so `pip install context-grid` never drags in torch, CUDA or a PDF engine.
dependencies = [
    "numpy>=1.24",
    # The config file is the product, so its parser is not optional. ~800 KB.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parse = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pymupdf4llm>=0.0.17",
]
# Layout-model parsing. Heavy -- it downloads and runs vision models -- which is why it is its
# own extra rather than part of [parse].
parse-ml = [
    "docling>=2.0",
]
# marker is deliberately NOT in [parse-ml], and this is not tidiness.
#
# marker-pdf pulls surya-ocr, which wants transformers>=5.12 and pillow<11; docling wants
# transformers<5.9 and pdfplumber wants pillow>=12.2. pip will resolve all three onto one set
# by backtracking -- and the set it lands on breaks docling at *runtime* with
# `ConversionError: KeyError: torch.float64`. A resolver saying yes is not the same as the
# combination working, and an extra that installs cleanly and then breaks another parser is
# worse than one that refuses.
#
# Install it alone, in its own environment, when the marker arm is the one being measured.
parse-marker = [
    "marker-pdf>=1.0",
]
# The chunker libraries people actually deploy. chonkie is small (a few hundred KB) and
# purpose-built; langchain-text-splitters is heavier but is what most production RAG is
# running, which makes it the arm worth comparing against.
# Exact token counting, for costing. `cl100k_base` named this extra before it existed, so
# asking for it raised an install instruction for something unbuildable.
embed = [
    "tiktoken>=0.7",
]
chunk = [
    "chonkie>=1.7",
    "langchain-text-splitters>=0.3",
    "tree-sitter-language-pack>=0.9",
]
# Hosted embedding and generation models, through one interface. TEI needs nothing here --
# it is reached over plain urllib, so a running server plus the core install is enough.
llm = [
    "litellm>=1.60",
]
# Approximate search. faiss covers flat/IVF/HNSW/PQ from one wheel; usearch is a second
# implementation of HNSW with quantization built into the index rather than bolted on.
index = [
    "faiss-cpu>=1.8",
    "usearch>=2.12",
]
# Postgres with pgvector -- the index people actually deploy on. Needs a running server, so it
# is deliberately its own extra rather than part of [index].
pgvector = [
    "psycopg[binary]>=3.1",
]
# agno, for agentic retrieval and its readers. Optional: agentic retrieval falls back to this
# package's own LLM protocol without it.
# Generation metrics -- faithfulness, answer relevance and the rest -- through DeepEval, driven
# by whichever model the config already chose.
judge = [
    "deepeval>=4.0",
]
agent = [
    "agno>=2.8",
    # agno's PDF reader raises on import without it, and a PDF corpus is the case this axis
    # was built to measure.
    "pypdf>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Pinned to a floor rather than left open: mypy 2.x tightened numpy shape checking,
    # and an older local mypy silently passes code that CI rejects.
    "mypy>=2.3",
    # Pinned exactly, not floored. `ruff format` output changes between releases, so a floor
    # means CI can reformat code that a contributor's older ruff called clean -- which is a red
    # build nobody can reproduce locally. Raise this deliberately, and run `ruff format .` in the
    # same commit.
    "ruff==0.16.3",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "ranx>=0.3.20",
    "types-pyyaml",
    "chonkie>=1.7",
    "langchain-text-splitters>=0.3",
    "tree-sitter-language-pack>=0.9",
    "litellm>=1.60",
    "faiss-cpu>=1.8",
    "usearch>=2.12",
    "pymupdf4llm>=0.0.17",
    "agno>=2.8",
    "pypdf>=4.0",
    "deepeval>=4.0",
    "tiktoken>=0.7",
]

[project.scripts]
contextgrid = "contextgrid.cli:main"

[project.urls]
Homepage = "https://github.com/sushantgundla/context-grid"
Documentation = "https://context-grid.mintlify.site"
Issues = "https://github.com/sushantgundla/context-grid/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/contextgrid"]

# The sdist is a source distribution, not a copy of the working tree. Tests and docs stay in --
# they are what makes a source release worth downloading. Everything below is either an agent
# harness, a working note, or a build artefact, and none of it belongs in something people
# `pip download`.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.github",
    "/data",
    "/data/.gitkeep",
    "/docs/drives",
    "/docker-compose.yml",
    "/Dockerfile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: touches the network, a model or an API. Skipped by default.",
    "slow: takes more than a second.",
]

[tool.coverage.run]
source = ["src/contextgrid"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol method bodies are `...` and are never executed by definition.
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

# `ruff check .` and `ruff format --check .` run from the repository root in CI, so without this
# they walk everything -- and two directories here are not the package.
#
# `.claude` is an agent harness, not shipped code. Its scripts are deliberately written to keep
# working when contextgrid itself is broken, and holding them to the package's line length gained
# nothing and cost a red build on every push.
#
# `docs` and `docs-site` are excluded from *formatting*, which is the part that matters: recent
# ruff reformats Python inside Markdown code blocks, and the examples in those pages are
# byte-for-byte transcripts of real runs, checked against the tool by the drives in `docs/drives`.
# A formatter rewriting them would silently break the one property that makes them trustworthy.
extend-exclude = [".claude", "docs", "docs-site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]

[tool.mypy]
# No `python_version` here, and that is deliberate rather than an omission.
#
# It used to say `python_version = "3.10"`, which told mypy to parse *everything* as 3.10 --
# including third-party stubs. numpy's `__init__.pyi` now uses PEP 695 `type` statements, which
# are 3.12 syntax, so mypy refused to parse numpy at all and CI died with
# `numpy/__init__.pyi:737: error: Type statement is only supported in Python 3.12 and greater`.
# The package's own code was never the problem, and pinning numpy to dodge it would trade a real
# dependency upgrade for a config line.
#
# The 3.10 guarantee is not lost, it moved to the two places that can actually enforce it: the CI
# matrix runs mypy under 3.10, 3.11, 3.12 and 3.13, so the 3.10 job checks 3.10 semantics with a
# 3.10 interpreter; and `scripts/check-oldest-numpy.sh` passes `--python-version 3.10` explicitly
# against the oldest numpy that Python 3.10 can install, which is the case a matrix job cannot see.
strict = true
warn_unreachable = true
files = ["src/contextgrid"]

# Adopted libraries that ship no type information. The adapters around them are typed and
# strict; declaring the import here means type-checking does not depend on which optional
# extras happen to be installed in the environment doing the checking.
[[tool.mypy.overrides]]
module = [
    "chonkie.*",
    "langchain_text_splitters.*",
    "litellm.*",
    "openai.*",
    "faiss.*",
    "usearch.*",
    "psycopg.*",
    "docling.*",
    "docling_core.*",
    "marker.*",
    "pymupdf4llm.*",
    "agno.*",
    "deepeval.*",
    "tiktoken.*",
    "tree_sitter_language_pack.*",
]
ignore_missing_imports = true
