[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-grid"
version = "0.9.0"
description = "A lab for grounding pipelines: sweep parser x chunker x embedder x index x reranker on your own documents, scored on quality, latency and cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sushant Gundla" }]
keywords = ["rag", "retrieval", "evaluation", "benchmark", "embeddings", "chunking", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# The core stays dependency-free on purpose. Everything heavy lives behind an extra,
# so `pip install context-grid` never drags in torch, CUDA or a PDF engine.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
parse = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Pinned to a floor rather than left open: mypy 2.x tightened numpy shape checking,
    # and an older local mypy silently passes code that CI rejects.
    "mypy>=2.3",
    "ruff>=0.5",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "ranx>=0.3.20",
]

[project.scripts]
contextgrid = "contextgrid.cli:main"

[project.urls]
Homepage = "https://github.com/sushantgundla/context-grid"
Documentation = "https://github.com/sushantgundla/context-grid/tree/main/docs"
Issues = "https://github.com/sushantgundla/context-grid/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/contextgrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: touches the network, a model or an API. Skipped by default.",
    "slow: takes more than a second.",
]

[tool.coverage.run]
source = ["src/contextgrid"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol method bodies are `...` and are never executed by definition.
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/contextgrid"]
