<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" role="img" aria-label="context-grid">
  <title>context-grid</title>
  <!-- For dark backgrounds: the same mark, wordmark in near-white, cells lifted so the low-score
       end of the heatmap does not disappear into the page. -->
  <g fill="#2DD4BF">
    <rect x="4" y="18" width="16" height="16" rx="3" opacity="0.28"/>
    <rect x="27" y="18" width="16" height="16" rx="3" opacity="0.44"/>
    <rect x="50" y="18" width="16" height="16" rx="3" opacity="0.26"/>
    <rect x="73" y="18" width="16" height="16" rx="3" opacity="0.36"/>

    <rect x="4" y="41" width="16" height="16" rx="3" opacity="0.40"/>
    <rect x="27" y="41" width="16" height="16" rx="3" opacity="0.62"/>
    <rect x="50" y="41" width="16" height="16" rx="3" opacity="0.32"/>
    <rect x="73" y="41" width="16" height="16" rx="3" opacity="0.50"/>

    <rect x="4" y="64" width="16" height="16" rx="3" opacity="0.34"/>
    <rect x="27" y="64" width="16" height="16" rx="3" opacity="0.52"/>
    <rect x="50" y="64" width="16" height="16" rx="3" opacity="1"/>
    <rect x="73" y="64" width="16" height="16" rx="3" opacity="0.42"/>

    <rect x="4" y="87" width="16" height="16" rx="3" opacity="0.24"/>
    <rect x="27" y="87" width="16" height="16" rx="3" opacity="0.38"/>
    <rect x="50" y="87" width="16" height="16" rx="3" opacity="0.58"/>
    <rect x="73" y="87" width="16" height="16" rx="3" opacity="0.30"/>
  </g>
  <rect x="45.5" y="59.5" width="25" height="25" rx="5.5" fill="none" stroke="#5EEAD4" stroke-width="2.2"/>

  <text x="112" y="72"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="600" letter-spacing="-1.2" fill="#F8FAFC">context<tspan fill="#2DD4BF">-</tspan>grid</text>
</svg>
