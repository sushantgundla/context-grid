<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="context-grid">
  <title>context-grid</title>
  <!--
    The mark is the thing the tool produces: a grid of configurations, each one scored.

    Sixteen cells, teal at varying strength - a heatmap, not decoration. One cell is at full
    strength with a ring around it: the winning configuration, which is the entire point of
    running a sweep. Read left to right it is a grid; read for a second longer it is a result.
  -->
  <g fill="#0D9488">
    <rect x="12" y="12" width="18" height="18" rx="3.5" opacity="0.22"/>
    <rect x="38" y="12" width="18" height="18" rx="3.5" opacity="0.38"/>
    <rect x="64" y="12" width="18" height="18" rx="3.5" opacity="0.20"/>
    <rect x="90" y="12" width="18" height="18" rx="3.5" opacity="0.30"/>

    <rect x="12" y="38" width="18" height="18" rx="3.5" opacity="0.34"/>
    <rect x="38" y="38" width="18" height="18" rx="3.5" opacity="0.55"/>
    <rect x="64" y="38" width="18" height="18" rx="3.5" opacity="0.26"/>
    <rect x="90" y="38" width="18" height="18" rx="3.5" opacity="0.44"/>

    <rect x="12" y="64" width="18" height="18" rx="3.5" opacity="0.28"/>
    <rect x="38" y="64" width="18" height="18" rx="3.5" opacity="0.46"/>
    <!-- the winner -->
    <rect x="64" y="64" width="18" height="18" rx="3.5" opacity="1"/>
    <rect x="90" y="64" width="18" height="18" rx="3.5" opacity="0.36"/>

    <rect x="12" y="90" width="18" height="18" rx="3.5" opacity="0.18"/>
    <rect x="38" y="90" width="18" height="18" rx="3.5" opacity="0.32"/>
    <rect x="64" y="90" width="18" height="18" rx="3.5" opacity="0.52"/>
    <rect x="90" y="90" width="18" height="18" rx="3.5" opacity="0.24"/>
  </g>
  <rect x="59" y="59" width="28" height="28" rx="6" fill="none" stroke="#14B8A6" stroke-width="2.5"/>
</svg>
